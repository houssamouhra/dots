backend = "xrender";
vsync = true;
use-damage = true;

shadow = false;
fading = false;

# Light fading
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

# Detection
detect-client-opacity = true;
detect-transient = true;
use-ewmh-active-win = true;

rules = (
    { match = "focused"; opacity = 1.0; },
    { match = "!focused"; opacity = 0.95; },

    # dmenu fully opaque
    { match = "class_g = 'dmenu'"; opacity = 1.0; },
    { match = "class_g = 'zen'"; opacity = 1.0; },
);
